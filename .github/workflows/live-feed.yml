name: Refresh live Pump.fun feed

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ohmoon-live-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture public creation events
        run: node scripts/capture-live.cjs
        env:
          CAPTURE_MS: '120000'
      - name: Publish updated feed
        run: |
          if git diff --quiet -- feed/live-projects.json; then exit 0; fi
          git config user.name "ohmoon-feed"
          git config user.email "actions@users.noreply.github.com"
          git add feed
          git commit -m "Update live Pump.fun feed"
          git push
